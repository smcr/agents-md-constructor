apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents-md-creator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agents-md-creator
  template:
    metadata:
      labels:
        app: agents-md-creator
    spec:
      containers:
        - name: app
          image: agents-md-creator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agents-md-creator
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
